<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript ตัวอย่างที่1</title>
</head>
<body>
    
    <h1>ตัวอย่างการเขียน JavaScript แบบฝั่งใน HTML</h1>

    <button onclick="showMessage()">กดเพื่อแสดงข้อความ</button>

    <script>
        function showMessage() {
            alert("สวัสดี!นี่คือข้อความจาก JavaScript ในแท็ค script");
        }

        console.log("โค้ดในแท็ค script ทำงานเเล้ว...");
    </script>
</body>
</html>
