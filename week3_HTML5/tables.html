<!DOCTYPE html>
<html lang="en">
<head>

    <title>ตารางข้อมูลผู้ใช้</title>
    <style>
        table, th, td {
            border: 1px solid #000;
            border-collapse: collapse;
            padding: 8px;
        }
    </style>
</head>
<body>
    <table>
        <caption>ตารางข้อมูลผู้ใช้</caption>
        <tr>
            <th rowspan="2">ชื่อ</th>
            <th colspan="2">เพศ</th>
            <th rowspan="2">Email</th>
        </tr>
        <tr>
            <th>ชื่อ</th>
            <th>อายุ</th>
        </tr>
        <tr>
            <td>เบนจามิน</td>
            <td>ชาย</td>
            <td>20</td>
        </tr>
        <tr>
            <td>อีวาน</td>
            <td>ชาย</td>
            <td>22</td>
        </tr>
    </table>
</body>
</html>
