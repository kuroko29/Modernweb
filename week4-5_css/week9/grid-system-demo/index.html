<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid System Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>CSS Grid System Demo</h1>
  <p>ตัวอย่างพื้นฐานของ Grid: กำหนดคอลัมน์ / แถว และกำหนดตำแหน่งกล่องลูก</p>

  <!-- Grid container: บรรจุกล่อง item ทั้งหมดไว้ใน layout แบบ grid -->
  <div class="grid-container">
    <!-- item1 ยืดออก 2 คอลัมน์ -->
    <div class="item item1">Item 1 (ขยาย 2 คอลัมน์)</div>

    <!-- item2 อยู่ช่องถัดไปโดยอัตโนมัติ -->
    <div class="item item2">Item 2</div>

    <!-- item3 จัดให้อยู่แถวล่าง -->
    <div class="item item3">Item 3 (อยู่แถวล่าง)</div>

    <div class="item item4">Item 4</div>
    <div class="item item5">Item 5</div>
  </div>
</body>
</html>
