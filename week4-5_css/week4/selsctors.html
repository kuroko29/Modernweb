<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>ตัวอย่าง CSS Selectors</h1>
    
    <!-- Element Selector -->
    <p>
        ข้อความนี้ถูกจัดสีด้วย Element Selector (p { color: green; })
    </p>
    
    <!-- Class Selector -->
    <p class="highlight">
        ข้อความนี้ถูกจัดสีด้วย Class Selector (.highlight { background-color: yellow; })
    </p>
    
    <!-- ID Selector -->
    <h1 id="header">
         นี่คือพื้นนี้ Header (ID Selector)
    </h1>
</body>
</html>
