<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Lab 2</title>
    <link rel="stylesheet" href="examlab2.css">
</head>
<body>
    <div class="container">
        <form>
            <h1>สมัคร</h1>
            <p>ง่ายและรวดเร็ว</p>

            <div class="row name-row">
                <div class="field">
                    <input type="text" name="first_name" placeholder="ชื่อ">
                </div>
                <div class="field">
                    <input type="text" name="last_name" placeholder="นามสกุล">
                </div>
            </div>

            <input type="text" name="phone" placeholder="หมายเลขโทรศัพท์หรืออีเมล">
            <input type="password" name="new_password" placeholder="รหัสผ่านใหม่">

            <label>วันเกิด</label>
            <div class="row dob-row">
                <select name="day">
                    <option value="">วัน</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
                <select name="month">
                    <option value="">เดือน</option>
                    <option value="1">มกราคม</option>
                    <option value="2">กุมภาพันธ์</option>
                    <option value="3">มีนาคม</option>
                    <option value="4">เมษายน</option>
                    <option value="5">พฤษภาคม</option>
                    <option value="6">มิถุนายน</option>
                    <option value="7">กรกฎาคม</option>
                    <option value="8">สิงหาคม</option>
                    <option value="9">กันยายน</option>
                    <option value="10">ตุลาคม</option>
                </select>
                <select name="year">
                    <option value="">ปี</option>
                    <option value="1990">2000</option>
                    <option value="1991">2001</option>
                    <option value="1992">2002</option>
                    <option value="1993">2003</option>
                    <option value="1994">2004</option>
                    <option value="1995">2005</option>
                    <option value="1996">2006</option>
                    <option value="1997">2007</option>
                    <option value="1998">2008</option>
                    <option value="1999">2009</option>
                </select>
            </div>
            <label>เพศ</label><br>
            <input type="radio" name="gender" value="male"> ชาย
            <input type="radio" name="gender" value="female"> หญิง

            <p class="terms">เมื่อคลิก สมัคร แสดงว่าคุณยอมรับข้อกำหนด นโยบายข้อมูล และ นโยบายคุกกี้ของทา คุณอาจได้รับการแจ้งเตือนทาง SMS จากเรา และ สามารถเลือกไม่รับได้ในภายหลัง</p>
            <button type="submit">สมัคร</button>
        </form>
    </div>
</body>
</html>
